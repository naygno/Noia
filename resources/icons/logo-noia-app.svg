<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradiente de Fundo Dark Void -->
    <linearGradient id="bgVoid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#040608"/>
    </linearGradient>

    <!-- Gradiente Diagonal Neon Emerald para Cyber Gold -->
    <linearGradient id="neonDiagonal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff66"/>
      <stop offset="65%" stop-color="#00ff66"/>
      <stop offset="100%" stop-color="#ffe600"/>
    </linearGradient>

    <!-- Gradiente das Hastes Electric Blue -->
    <linearGradient id="electricBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0077b6"/>
    </linearGradient>
  </defs>

  <!-- 1. Base Squircle com Borda Tecnológica -->
  <rect x="20" y="20" width="472" height="472" rx="100" ry="100" fill="url(#bgVoid)" stroke="#00ff66" stroke-width="3" stroke-opacity="0.3"/>
  
  <!-- 2. Linhas de Circuito / Detalhes Tecnológicos -->
  <path d="M 60 140 L 120 80 M 452 372 L 392 432" stroke="#00d4ff" stroke-width="2" stroke-opacity="0.3" stroke-linecap="round"/>
  <circle cx="120" cy="80" r="4" fill="#00d4ff" fill-opacity="0.6"/>
  <circle cx="392" cy="432" r="4" fill="#00d4ff" fill-opacity="0.6"/>

  <!-- 3. Haste Vertical Esquerda (Electric Blue) -->
  <path d="M 120 120 L 180 120 L 180 392 L 120 392 Z" fill="url(#electricBlue)"/>

  <!-- 4. Haste Vertical Direita (Electric Blue) -->
  <path d="M 332 120 L 392 120 L 392 392 L 332 392 Z" fill="url(#electricBlue)"/>

  <!-- 5. Brilho Neon Vetorial da Diagonal (Glow sem filtros bugados) -->
  <polygon points="120,120 188,120 392,392 324,392" fill="#00ff66" opacity="0.25" stroke="#00ff66" stroke-width="12" stroke-linejoin="round"/>

  <!-- 6. Traço Diagonal Dominante (Neon Emerald -> Cyber Gold) -->
  <polygon points="120,120 188,120 392,392 324,392" fill="url(#neonDiagonal)"/>

  <!-- 7. Terminal Nodes / Acentos Cyber Gold -->
  <circle cx="120" cy="120" r="6" fill="#ffe600"/>
  <circle cx="392" cy="392" r="6" fill="#ffe600"/>
</svg>